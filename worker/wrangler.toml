name = "astro-xp"
main = "catalog-worker.ts"
compatibility_date = "2026-07-29"
workers_dev = false

# The built site. Files are served from the edge; the Worker only runs for
# /api/* and for paths that match no file.
[assets]
directory = "../dist"
run_worker_first = ["/api/*"]

[[routes]]
pattern = "xp.4st.li"
custom_domain = true
