<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    />
    <title>reVC</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #05070b;
        color: #fff;
        font:
          13px Tahoma,
          sans-serif;
      }

      #setup {
        display: grid;
        width: 100%;
        height: 100%;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 25% 20%, #8f285d 0, transparent 36%),
          radial-gradient(circle at 80% 75%, #125b81 0, transparent 42%),
          #080a12;
      }

      .setup-card {
        width: min(560px, 100%);
        padding: 24px;
        border: 1px solid #8995aa;
        background: rgba(7, 10, 18, 0.94);
        box-shadow: 0 12px 40px #000;
      }

      h1 {
        margin: 0 0 12px;
        color: #ff91c8;
        font-size: 24px;
      }

      p {
        margin: 8px 0;
        line-height: 1.45;
      }

      .notice {
        margin: 18px 0;
        padding: 12px;
        border-left: 4px solid #f0b43c;
        background: #202331;
      }

      .setup-action {
        display: inline-block;
        margin-top: 8px;
        padding: 7px 16px;
        border: 1px solid #fff;
        background: linear-gradient(#f8f8f8, #c8c8c8);
        color: #111;
        cursor: pointer;
        font: inherit;
      }

      .setup-action:active {
        background: linear-gradient(#bbb, #eee);
      }

      .setup-action:disabled {
        color: #666;
        cursor: wait;
      }

      .source-field {
        display: block;
        width: 100%;
        margin-top: 8px;
        padding: 7px 9px;
        border: 1px solid #8995aa;
        background: #fff;
        color: #111;
        font: inherit;
      }

      .source-label {
        display: block;
        margin-top: 16px;
      }

      .keep-copy {
        display: block;
        margin: 12px 0 2px;
        text-align: left;
      }

      .hidden-input {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        opacity: 0;
      }

      #selection {
        min-height: 18px;
        color: #a9d8ff;
      }

      a {
        color: #84c9ff;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #000;
      }
    </style>
  </head>
  <body>
    <main id="setup">
      <section class="setup-card">
        <h1>reVC</h1>
        <p>
          The reVCDOS browser engine is installed. Compatible game data is not
          included with Astro XP.
        </p>
        <div class="notice">
          Select the compatible <strong>vc-assets</strong> game files you own,
          or download them from an external torrent. Torrent downloads are about
          860 MiB and expose your IP address to peers.
        </div>
        <label class="setup-action" for="file-input"
          >Select your game files…</label
        >
        <input
          id="file-input"
          class="hidden-input"
          type="file"
          webkitdirectory
          directory
        />
        <label class="keep-copy"
          ><input id="keep-copy" type="checkbox" checked /> Keep the optimized
          game data in this browser for next time</label
        >
        <label class="source-label" for="torrent-source"
          >Torrent URL or magnet</label
        >
        <input
          id="torrent-source"
          class="source-field"
          type="text"
          value="revcdoseng.torrent"
          spellcheck="false"
          autocomplete="off"
        />
        <button
          id="download-button"
          class="setup-action"
          type="button"
          disabled
        >
          Loading downloader…
        </button>
        <label class="setup-action" for="torrent-file-input"
          >Select .torrent file…</label
        >
        <input
          id="torrent-file-input"
          class="hidden-input"
          type="file"
          accept=".torrent,application/x-bittorrent"
        />
        <p id="selection" role="status"></p>
        <p>
          Port by
          <a href="https://dos.zone/revcdos/" target="_blank" rel="noreferrer"
            >DOS.Zone Team</a
          >.
        </p>
      </section>
    </main>

    <script src="../../js/storage-policy.js"></script>
    <script type="module">
      import WebTorrent from "../../vendor/webtorrent/webtorrent.min.js";
      import { loadPackedManifest, packFiles } from "./packed-store.js";

      ("use strict");

      const storagePolicy = window.AstroStoragePolicy;
      const DEFAULT_TORRENT_SOURCE = "revcdoseng.torrent";
      const DOWNLOAD_COMPLETE_KEY = "astro-xp.revcdos.download-complete.v1";
      const DOWNLOAD_SOURCE_KEY = "astro-xp.revcdos.download-source.v1";
      const WEB_TRACKERS = ["wss://cloud.dos.zone:8444/announce-ws"];
      const CONNECTION_TIMEOUT = 20000;
      const PREFLIGHT_TIMEOUT = 10000;
      const input = document.getElementById("file-input");
      const torrentFileInput = document.getElementById("torrent-file-input");
      const torrentSourceInput = document.getElementById("torrent-source");
      const keepCopyInput = document.getElementById("keep-copy");
      const downloadButton = document.getElementById("download-button");
      const setup = document.getElementById("setup");
      const selection = document.getElementById("selection");
      let gameFrame = null;
      let sessionFiles = new Map();
      let activeTorrentSession = null;

      const cacheEngineForOfflineUse = () => {
        window.parent.postMessage(
          { event: "astro.offline-game-ready", gameId: "revcdos" },
          location.origin,
        );
      };

      const startGame = (message, session = false) => {
        selection.textContent = message;
        gameFrame = document.createElement("iframe");
        // reVC opens in its window. The window's own button goes fullscreen.
        gameFrame.src = `game.html?fullscreen=0${session ? "&session=1" : ""}`;
        gameFrame.allow = "fullscreen";
        gameFrame.title = "reVC";
        setup.replaceWith(gameFrame);
      };

      const formatBytes = (bytes) => {
        if (!Number.isFinite(bytes) || bytes <= 0) return "0 MiB";
        return `${(bytes / 1024 / 1024).toFixed(1)} MiB`;
      };

      const normalizeAssetPath = (path) =>
        String(path).replaceAll("\\", "/").replace(/^\/+/, "").toLowerCase();

      const findSessionFile = (requestedPath) => {
        const path = normalizeAssetPath(requestedPath);
        const candidates = [
          path,
          path.replace(/^fetched\//, "vc-assets/local/"),
          path.replace(/^vcsky\/fetched\//, "vc-assets/local/"),
        ];
        for (const candidate of candidates) {
          const file = sessionFiles.get(candidate);
          if (file) return file;
        }
        return null;
      };

      const setSessionFiles = (entries) => {
        sessionFiles = new Map(
          [...entries].map(([path, file]) => [normalizeAssetPath(path), file]),
        );
        if (!sessionFiles.size) {
          throw new Error("The selected folder is empty.");
        }
      };

      const selectedTorrentSource = async () => {
        const [torrentFile] = torrentFileInput.files;
        if (torrentFile) {
          return {
            source: new Uint8Array(await torrentFile.arrayBuffer()),
            identity: `file:${torrentFile.name}:${torrentFile.size}`,
          };
        }

        const value = torrentSourceInput.value.trim();
        if (!value) {
          throw new Error(
            "Enter a torrent URL or magnet, or select a .torrent file.",
          );
        }
        if (value.startsWith("magnet:?")) {
          return { source: value, identity: value };
        }

        let url;
        try {
          url = new URL(value, location.href);
        } catch {
          throw new Error("Enter a valid torrent URL or magnet.");
        }
        if (!["http:", "https:"].includes(url.protocol)) {
          throw new Error("Torrent URLs must use HTTP or HTTPS.");
        }
        return { source: url.href, identity: value };
      };

      const localAssetUrl = (path) =>
        `local-assets/${path
          .split("/")
          .map((part) => encodeURIComponent(part))
          .join("/")}`;

      const waitForServiceWorkerController = async () => {
        await navigator.serviceWorker.ready;
        if (navigator.serviceWorker.controller) return;
        await new Promise((resolve, reject) => {
          const timeout = setTimeout(
            () =>
              reject(
                new Error(
                  "The offline engine is not ready. Reload Astro XP and try again.",
                ),
              ),
            10000,
          );
          navigator.serviceWorker.addEventListener(
            "controllerchange",
            () => {
              clearTimeout(timeout);
              resolve();
            },
            { once: true },
          );
        });
      };

      const verifyPackedAssets = async (manifest) => {
        const firstPath = Object.keys(manifest.files)[0];
        if (!firstPath) throw new Error("The selected folder is empty.");
        await waitForServiceWorkerController();
        navigator.serviceWorker.controller.postMessage({
          type: "REVCDOS_PACK_UPDATED",
        });
        const response = await fetch(localAssetUrl(firstPath), {
          cache: "no-store",
          headers: { Range: "bytes=0-0" },
        });
        if (response.status !== 206) {
          throw new Error(
            "The offline data service is not ready. Install any pending Astro XP update, reload, and try again.",
          );
        }
      };

      const destroyTorrent = (client, torrent) =>
        new Promise((resolve) => {
          client.remove(torrent.infoHash, { destroyStore: true }, () =>
            client.destroy(resolve),
          );
        });

      const packAndStart = async (entries, torrentSession) => {
        downloadButton.disabled = true;
        input.disabled = true;
        torrentFileInput.disabled = true;
        torrentSourceInput.disabled = true;
        keepCopyInput.disabled = true;
        if (!keepCopyInput.checked) {
          setSessionFiles(entries);
          activeTorrentSession = torrentSession || null;
          startGame(
            `${sessionFiles.size.toLocaleString()} files ready. Starting reVC directly from this session…`,
            true,
          );
          return;
        }

        let lastUpdate = 0;
        const manifest = await packFiles(entries, (packed, total, path) => {
          const now = Date.now();
          if (now - lastUpdate < 100 && packed !== total) return;
          lastUpdate = now;
          selection.textContent = `Optimizing offline data… ${(
            (packed / total) *
            100
          ).toFixed(1)}% · ${path}`;
        });
        await verifyPackedAssets(manifest);
        if (torrentSession) {
          selection.textContent = "Stopping peer connections…";
          await destroyTorrent(torrentSession.client, torrentSession.torrent);
          localStorage.removeItem(DOWNLOAD_COMPLETE_KEY);
        }
        cacheEngineForOfflineUse();
        window.parent.postMessage(
          {
            event: "astro.game-data-retention",
            gameId: "revcdos",
            keep: keepCopyInput.checked,
          },
          location.origin,
        );
        window.parent.postMessage(
          { event: "astro.game-data-changed" },
          location.origin,
        );
        startGame(
          `${Object.keys(manifest.files).length.toLocaleString()} packed files ready. Starting reVC…`,
        );
      };

      const showProgress = (torrent) => {
        const percent = (torrent.progress * 100).toFixed(1);
        selection.textContent = `${percent}% · ${formatBytes(
          torrent.downloaded,
        )} of ${formatBytes(torrent.length)} · ${formatBytes(
          torrent.downloadSpeed,
        )}/s · ${torrent.numPeers} peer${torrent.numPeers === 1 ? "" : "s"}`;
      };

      const verifyTrackerConnection = () =>
        new Promise((resolve, reject) => {
          const socket = new WebSocket(WEB_TRACKERS[0]);
          let finished = false;
          const finish = (error) => {
            if (finished) return;
            finished = true;
            clearTimeout(timeout);
            socket.close();
            error ? reject(error) : resolve();
          };
          const timeout = setTimeout(
            () =>
              finish(
                new Error(
                  "The peer tracker could not be reached. A content blocker, firewall, or temporary tracker outage may be responsible.",
                ),
              ),
            PREFLIGHT_TIMEOUT,
          );
          socket.addEventListener("open", () => finish());
          socket.addEventListener("error", () =>
            finish(
              new Error(
                "The peer tracker was blocked. Allow privacy protections for this site, then try again.",
              ),
            ),
          );
        });

      const verifyPeerConnections = (iceServers) =>
        new Promise((resolve, reject) => {
          if (!globalThis.RTCPeerConnection) {
            reject(
              new Error(
                "Peer connections are unavailable. Enable WebRTC in your browser, then try again.",
              ),
            );
            return;
          }

          let connection;
          let finished = false;
          const finish = (error) => {
            if (finished) return;
            finished = true;
            clearTimeout(timeout);
            connection?.close();
            error ? reject(error) : resolve();
          };
          const timeout = setTimeout(
            () =>
              finish(
                new Error(
                  "Peer connections appear to be blocked. Enable WebRTC or allow privacy protections for this site, then try again.",
                ),
              ),
            PREFLIGHT_TIMEOUT,
          );

          try {
            connection = new globalThis.RTCPeerConnection({ iceServers });
            connection.createDataChannel("astro-xp-preflight");
            connection.addEventListener("icecandidate", (event) => {
              if (event.candidate) finish();
            });
            connection.addEventListener("icegatheringstatechange", () => {
              if (connection.iceGatheringState === "complete" && !finished) {
                finish(
                  new Error(
                    "Peer connections appear to be blocked. Enable WebRTC or allow privacy protections for this site, then try again.",
                  ),
                );
              }
            });
            connection
              .createOffer()
              .then((offer) => connection.setLocalDescription(offer))
              .catch(() =>
                finish(
                  new Error(
                    "Peer connections could not start. Enable WebRTC in your browser, then try again.",
                  ),
                ),
              );
          } catch {
            finish(
              new Error(
                "Peer connections could not start. Enable WebRTC in your browser, then try again.",
              ),
            );
          }
        });

      const downloadGameData = async () => {
        const keepBrowserCopy = keepCopyInput.checked;
        if (keepBrowserCopy && !navigator.storage?.getDirectory) {
          throw new Error(
            "Persistent browser storage is unavailable. Select a local vc-assets folder instead.",
          );
        }

        const { source: torrentSource, identity: sourceIdentity } =
          await selectedTorrentSource();
        const cached =
          keepBrowserCopy &&
          localStorage.getItem(DOWNLOAD_COMPLETE_KEY) === "true" &&
          localStorage.getItem(DOWNLOAD_SOURCE_KEY) === sourceIdentity;

        downloadButton.disabled = true;
        downloadButton.textContent = cached
          ? "Opening downloaded copy…"
          : "Connecting to peers…";
        selection.textContent = cached
          ? "Opening the downloaded game data…"
          : "Connecting to peers. Your IP address is visible to torrent peers.";

        let rootDir = null;
        if (keepBrowserCopy) {
          await storagePolicy.requestPersistence(navigator.storage);
          rootDir = await navigator.storage.getDirectory();
        }
        const rtcResponse = await fetch("/api/rtc", { cache: "no-store" });
        if (!rtcResponse.ok) {
          throw new Error(
            "Peer connection service is unavailable. Try again in a moment.",
          );
        }
        const { iceServers } = await rtcResponse.json();
        if (!Array.isArray(iceServers) || iceServers.length === 0) {
          throw new Error("Peer connection service returned no servers.");
        }
        if (!cached) {
          selection.textContent = "Checking peer connection support…";
          await Promise.all([
            verifyTrackerConnection(),
            verifyPeerConnections(iceServers),
          ]);
          selection.textContent =
            "Connecting to peers. Your IP address is visible to torrent peers.";
        }
        const client = new WebTorrent({
          dht: false,
          lsd: false,
          maxConns: 20,
          tracker: {
            rtcConfig: { iceServers },
          },
          uploadLimit: 262144,
        });

        let connectionTimer;
        let failed = false;
        const failDownload = (message) => {
          if (failed) return;
          failed = true;
          clearTimeout(connectionTimer);
          client.destroy();
          selection.textContent = message;
          downloadButton.disabled = false;
          input.disabled = false;
          torrentFileInput.disabled = false;
          torrentSourceInput.disabled = false;
          keepCopyInput.disabled = false;
          downloadButton.textContent = "Try torrent download again";
        };

        client.on("error", (error) =>
          failDownload(`Download failed: ${error.message}`),
        );

        const torrentOptions = {
          announce: WEB_TRACKERS,
          destroyStoreOnDestroy: !keepBrowserCopy,
          skipVerify: cached,
          uploads: 2,
        };
        if (rootDir) torrentOptions.storeOpts = { rootDir };
        const torrent = client.add(torrentSource, torrentOptions);

        let lastProgressUpdate = 0;
        torrent.on("download", () => {
          if (failed) return;
          const now = Date.now();
          if (now - lastProgressUpdate < 250) return;
          lastProgressUpdate = now;
          showProgress(torrent);
        });
        torrent.on("wire", () => {
          if (failed) return;
          clearTimeout(connectionTimer);
          selection.textContent = "Peer connected. Starting download…";
        });
        torrent.on("noPeers", () => {
          if (failed) return;
          selection.textContent =
            "No browser peers found yet. Retrying the trackers…";
        });
        torrent.on("warning", (warning) => {
          if (failed) return;
          if (warning.message.startsWith("Unsupported tracker protocol:")) {
            return;
          }
          if (
            warning.message.includes("tracker") ||
            warning.message.includes("WebSocket")
          ) {
            failDownload(
              "The peer tracker connection failed. Check content blockers or privacy protections, then try again.",
            );
            return;
          }
          console.warn("reVCDOS torrent warning:", warning);
        });
        torrent.on("error", (error) =>
          failDownload(`Download failed: ${error.message}`),
        );
        torrent.on("done", async () => {
          if (failed) return;
          clearTimeout(connectionTimer);
          if (keepBrowserCopy) {
            localStorage.setItem(DOWNLOAD_COMPLETE_KEY, "true");
            localStorage.setItem(DOWNLOAD_SOURCE_KEY, sourceIdentity);
          }
          selection.textContent = keepBrowserCopy
            ? "Download complete. Optimizing data for smooth offline play…"
            : "Download complete. Starting directly from temporary memory…";
          try {
            await packAndStart(
              torrent.files.map((file) => [file.path, file]),
              { client, torrent },
            );
          } catch (error) {
            failDownload(
              `Unable to prepare downloaded data: ${storagePolicy.errorMessage(error)}`,
            );
          }
        });
        if (!cached) {
          connectionTimer = setTimeout(() => {
            if (torrent.numPeers > 0 || torrent.downloaded > 0) return;
            failDownload(
              "No peer connection was established. Enable WebRTC or allow privacy protections for this site, then try again. You can also select a local vc-assets folder.",
            );
          }, CONNECTION_TIMEOUT);
        }
      };

      downloadButton.addEventListener("click", () => {
        downloadGameData().catch((error) => {
          selection.textContent = storagePolicy.errorMessage(error);
          downloadButton.disabled = false;
          torrentFileInput.disabled = false;
          torrentSourceInput.disabled = false;
          keepCopyInput.disabled = false;
          downloadButton.textContent = "Try torrent download again";
        });
      });

      torrentSourceInput.addEventListener("input", () => {
        torrentFileInput.value = "";
      });

      torrentFileInput.addEventListener("change", () => {
        const [torrentFile] = torrentFileInput.files;
        if (!torrentFile) return;
        torrentSourceInput.value = "";
        selection.textContent = `Selected torrent: ${torrentFile.name}`;
      });

      input.addEventListener("change", async () => {
        const selectedFiles = Array.from(input.files).map((file) => [
          file.webkitRelativePath,
          file,
        ]);
        if (!selectedFiles.length) return;
        try {
          selection.textContent = keepCopyInput.checked
            ? "Optimizing selected files for smooth offline play…"
            : "Checking selected files for direct play…";
          await packAndStart(selectedFiles);
        } catch (error) {
          selection.textContent = `Unable to prepare selected files: ${storagePolicy.errorMessage(error)}`;
          downloadButton.disabled = false;
          input.disabled = false;
          torrentFileInput.disabled = false;
          torrentSourceInput.disabled = false;
          keepCopyInput.disabled = false;
        }
      });

      window.addEventListener("message", async (event) => {
        if (!gameFrame || event.source !== gameFrame.contentWindow) return;
        const message = event.data;
        if (!message || typeof message.event !== "string") return;

        if (message.event === "revcdos.asset-request") {
          const [port] = event.ports;
          if (!port) return;
          try {
            const file = findSessionFile(message.path);
            if (!file) {
              throw new Error(`Game file not found: ${message.path}`);
            }
            const buffer = await file.arrayBuffer();
            port.postMessage({ buffer }, [buffer]);
          } catch (error) {
            port.postMessage({ error: storagePolicy.errorMessage(error) });
          }
          return;
        }

        if (message.event === "request-fullscreen") {
          gameFrame.requestFullscreen?.();
        }
      });

      window.addEventListener(
        "pagehide",
        () => {
          if (!activeTorrentSession) return;
          void destroyTorrent(
            activeTorrentSession.client,
            activeTorrentSession.torrent,
          );
          activeTorrentSession = null;
        },
        { once: true },
      );

      const packedManifest = await loadPackedManifest();
      if (packedManifest) {
        try {
          await verifyPackedAssets(packedManifest);
          cacheEngineForOfflineUse();
          startGame(
            `${Object.keys(packedManifest.files).length.toLocaleString()} packed files ready. Starting reVC…`,
          );
        } catch (error) {
          selection.textContent = storagePolicy.errorMessage(error);
          downloadButton.disabled = false;
          downloadButton.textContent = "Retry offline copy";
        }
      } else {
        downloadButton.disabled = false;
        downloadButton.textContent =
          localStorage.getItem(DOWNLOAD_COMPLETE_KEY) === "true" &&
          localStorage.getItem(DOWNLOAD_SOURCE_KEY) === DEFAULT_TORRENT_SOURCE
            ? "Optimize downloaded copy"
            : "Download from torrent";
      }
    </script>
  </body>
</html>
