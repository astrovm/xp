<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Boot Windows XP in your browser and play classic games with Ruffle, js-dos, ScummVM, and embedded web runtimes."
    />
    <meta name="theme-color" content="#245EDC" />
    <meta name="application-name" content="Astro XP" />
    <meta name="astro-version" content="development" />
    <script src="js/startup-recovery.js"></script>
    <link
      rel="preload"
      href="css/fonts/tahoma.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="css/fonts/arialbi.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link rel="stylesheet" href="css/fonts.css" />
    <link rel="canonical" href="https://xp.4st.li/" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Astro XP" />
    <meta property="og:title" content="Astro XP" />
    <meta
      property="og:description"
      content="Boot Windows XP in your browser and play classic games."
    />
    <meta property="og:url" content="https://xp.4st.li/" />
    <meta property="og:image" content="https://xp.4st.li/assets/xp/bliss.jpg" />
    <meta property="og:image:width" content="800" />
    <meta property="og:image:height" content="600" />
    <meta
      property="og:image:alt"
      content="Windows XP Bliss desktop wallpaper"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Astro XP" />
    <meta
      name="twitter:description"
      content="Boot Windows XP in your browser and play classic games."
    />
    <meta
      name="twitter:image"
      content="https://xp.4st.li/assets/xp/bliss.jpg"
    />
    <title>Astro XP</title>
    <meta name="astro-ruffle-src" content="js/ruffle.js" />
    <script defer src="vendor/fflate/index.js"></script>
    <script defer src="js/games.js"></script>
    <script defer src="js/flash-url-router.js"></script>
    <script defer src="js/storage-policy.js"></script>
    <script defer src="js/game-installer.js"></script>
    <script defer src="js/game-library.js"></script>
    <script defer src="js/game-data.js"></script>
    <script defer src="js/filesystem.js"></script>
    <script defer src="js/file-operations.js"></script>
    <script defer src="js/dialogs.js"></script>
    <script defer src="js/shell-cache.js"></script>
    <script defer src="js/offline.js"></script>
    <script defer src="js/main.js"></script>
    <script defer src="js/shell/display-scale.js"></script>
    <script defer src="js/shell/window-manager.js"></script>
    <script defer src="js/apps/display-properties.js"></script>
    <script defer src="js/apps/explorer.js"></script>
    <script defer src="js/apps/programs.js"></script>
    <script defer src="js/shell/taskbar-toolbars.js"></script>
    <script defer src="js/shell/taskbar-layout.js"></script>
    <script defer src="js/shell/taskbar.js"></script>
    <script defer src="js/shell/system-tray.js"></script>
    <script defer src="js/shell/desktop.js"></script>
    <script defer src="js/shell/start-menu.js"></script>
    <script defer src="js/shell/session.js"></script>
    <script defer src="js/shell/bootstrap.js"></script>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/shell/desktop.css" />
    <link rel="stylesheet" href="css/shell/windows.css" />
    <link rel="stylesheet" href="css/apps/system-windows.css" />
    <link rel="stylesheet" href="css/apps/display-properties.css" />
    <link rel="stylesheet" href="css/apps/programs.css" />
    <link rel="stylesheet" href="css/apps/task-manager.css" />
    <link rel="stylesheet" href="css/apps/volume-control.css" />
    <link rel="stylesheet" href="css/apps/common.css" />
    <link rel="stylesheet" href="css/apps/paint.css" />
    <link rel="stylesheet" href="css/apps/calculator.css" />
    <link rel="stylesheet" href="css/apps/pinball.css" />
    <link rel="stylesheet" href="css/shell/taskbar.css" />
    <link rel="stylesheet" href="css/shell/start-menu.css" />
    <link rel="stylesheet" href="css/shell/session.css" />
    <link rel="stylesheet" href="css/shell/scrollbars.css" />
    <link rel="stylesheet" href="css/shell/controls.css" />
    <link rel="stylesheet" href="css/shell/responsive.css" />
    <link rel="stylesheet" href="css/shell/themes.css" />
    <link rel="stylesheet" href="css/apps/minesweeper.css" />
    <link rel="stylesheet" href="css/apps/cards.css" />
    <link rel="stylesheet" href="css/apps/freecell.css" />
    <link rel="stylesheet" href="css/apps/hearts.css" />
    <link rel="stylesheet" href="css/apps/solitaire.css" />
    <link rel="stylesheet" href="css/apps/spider-solitaire.css" />
    <script type="module" src="apps/index.js"></script>
  </head>

  <body>
    <!-- Boot screen -->
    <div
      id="boot-screen"
      role="button"
      tabindex="0"
      aria-label="Continue to the welcome screen"
    >
      <div class="boot-display" aria-hidden="true">
        <img
          class="boot-background"
          src="assets/xp/BootScreen.png"
          alt=""
          width="640"
          height="480"
          fetchpriority="high"
        />
        <div class="boot-fade">
          <img src="assets/xp/BootFade.png" alt="" width="640" height="9600" />
        </div>
        <div class="boot-progress">
          <img src="assets/xp/BootProgress.png" alt="" width="22" height="9" />
        </div>
      </div>
    </div>

    <!-- Welcome screen -->
    <div id="welcome-screen" hidden>
      <div class="welcome-content">
        <img
          class="welcome-wordmark"
          src="assets/xp/WindowsWordmark.png"
          alt="Microsoft Windows XP"
        />
        <p class="welcome-message">welcome</p>
        <div class="welcome-panel">
          <p class="welcome-instruction">To begin, click your user name</p>
          <button id="login-user" type="button">
            <span class="welcome-avatar" aria-hidden="true"
              ><img src="assets/xp/Chess.bmp" alt="" width="48" height="48"
            /></span>
            <span class="welcome-user-details"
              ><span class="welcome-username">astro</span
              ><span id="welcome-user-status" hidden>Logged on</span></span
            >
          </button>
        </div>
      </div>
      <button id="welcome-turn-off" type="button">
        <span class="welcome-turn-off-icon" aria-hidden="true"></span>
        <span>Turn off computer</span>
      </button>
    </div>

    <!-- Desktop -->
    <div id="desktop" hidden>
      <div id="desktop-icons" tabindex="0"></div>
      <div id="desktop-selection" aria-hidden="true" hidden></div>

      <div
        id="desktop-context-menu"
        class="xp-context-menu"
        role="menu"
        hidden
      ></div>

      <div id="window-system-menu" class="xp-context-menu" role="menu" hidden>
        <button type="button" role="menuitem" data-command="restore">
          <span class="context-check sysmenu-glyph" aria-hidden="true"></span>
          <span class="context-label">Restore</span>
        </button>
        <button type="button" role="menuitem" data-command="move">
          <span class="context-check" aria-hidden="true"></span>
          <span class="context-label">Move</span>
        </button>
        <button type="button" role="menuitem" data-command="size">
          <span class="context-check" aria-hidden="true"></span>
          <span class="context-label">Size</span>
        </button>
        <button type="button" role="menuitem" data-command="minimize">
          <span class="context-check sysmenu-glyph" aria-hidden="true"></span>
          <span class="context-label">Minimize</span>
        </button>
        <button type="button" role="menuitem" data-command="maximize">
          <span class="context-check sysmenu-glyph" aria-hidden="true"></span>
          <span class="context-label">Maximize</span>
        </button>
        <span class="context-separator" aria-hidden="true"></span>
        <button
          type="button"
          role="menuitem"
          data-command="close"
          class="context-default"
        >
          <span class="context-check sysmenu-glyph" aria-hidden="true"></span>
          <span class="context-label">Close</span>
          <span class="context-shortcut">Alt+F4</span>
        </button>
      </div>

      <!-- Start menu -->
      <div id="start-menu" hidden>
        <div class="start-menu-header">
          <span
            class="start-menu-avatar xp-user-tile"
            aria-hidden="true"
          ></span>
          <span class="start-menu-user">astro</span>
        </div>
        <div class="start-menu-body">
          <div class="start-menu-left">
            <div id="start-menu-pinned"></div>
            <div class="sm-all-programs-separator"></div>
            <button id="all-programs-button" type="button">
              <span class="all-programs-label">All Programs</span>
              <span class="all-programs-arrow" aria-hidden="true"></span>
            </button>
          </div>
          <div class="start-menu-right" id="start-menu-places"></div>
        </div>
        <div class="start-menu-footer">
          <button id="log-off-button" type="button">
            <span class="xp-logoff-icon" aria-hidden="true"></span>
            Log Off
          </button>
          <button id="turn-off-button" type="button">
            <span class="xp-power-icon" aria-hidden="true"></span>
            Turn Off Computer
          </button>
        </div>
      </div>
      <div id="start-menu-flyouts" aria-label="All Programs" hidden></div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar" hidden>
      <button id="start-button" type="button" aria-label="start">
        <img src="assets/xp/WindowsFlag.png" alt="" aria-hidden="true" />
        <span>Start</span>
      </button>
      <div id="taskbar-resize" aria-hidden="true"></div>
      <div id="taskbar-toolbars" hidden></div>
      <div id="task-buttons"></div>
      <div id="taskbar-tray">
        <button
          id="tray-expand"
          type="button"
          aria-label="Show hidden icons"
          hidden
        >
          ‹
        </button>
        <button
          id="tray-volume-button"
          class="tray-icon tray-volume"
          type="button"
          title="Volume"
          aria-label="Volume"
          aria-haspopup="dialog"
        ></button>
        <button id="taskbar-clock" type="button"></button>
      </div>
      <div id="tray-volume-popup" role="dialog" aria-label="Volume" hidden>
        <span>Volume</span>
        <input
          type="range"
          id="tray-volume-slider"
          class="tray-volume-slider"
          min="0"
          max="100"
          step="1"
          aria-label="Volume"
        />
        <label class="tray-mute-row" for="tray-mute-checkbox">
          <input type="checkbox" id="tray-mute-checkbox" />
          Mute
        </label>
      </div>
    </div>

    <div id="tray-volume-menu" class="xp-context-menu" role="menu" hidden>
      <button type="button" role="menuitem">Open Volume Control</button>
    </div>
    <div id="start-button-menu" class="xp-context-menu" role="menu" hidden>
      <button type="button" role="menuitem" data-start-button-action="search">
        <span class="context-check" aria-hidden="true"></span>
        <span class="context-label">Search...</span>
      </button>
      <button
        type="button"
        role="menuitem"
        data-start-button-action="properties"
      >
        <span class="context-check" aria-hidden="true"></span>
        <span class="context-label">Properties</span>
      </button>
    </div>
    <div id="taskbar-context-menu" class="xp-context-menu" role="menu" hidden>
      <div id="taskbar-toolbar-parent" class="context-parent">
        <button
          type="button"
          role="menuitem"
          data-taskbar-action="toolbars"
          aria-haspopup="menu"
          aria-expanded="false"
        >
          <span class="context-check" aria-hidden="true"></span>
          <span class="context-label">Toolbars</span>
          <span class="context-arrow" aria-hidden="true"></span>
        </button>
        <div
          id="taskbar-toolbar-submenu"
          class="xp-context-menu context-submenu"
          role="menu"
        >
          <button type="button" role="menuitem" data-taskbar-toolbar="desktop">
            <span class="context-check" aria-hidden="true"></span>
            <span class="context-label">Desktop</span>
          </button>
          <button
            type="button"
            role="menuitem"
            data-taskbar-toolbar="quick-launch"
          >
            <span class="context-check" aria-hidden="true"></span>
            <span class="context-label">Quick Launch</span>
          </button>
          <span class="context-separator" aria-hidden="true"></span>
          <button type="button" role="menuitem" data-taskbar-toolbar="new">
            <span class="context-check" aria-hidden="true"></span>
            <span class="context-label">New Toolbar...</span>
          </button>
        </div>
      </div>
      <span class="context-separator" aria-hidden="true"></span>
      <button type="button" role="menuitem" data-taskbar-action="cascade">
        <span class="context-check" aria-hidden="true"></span>
        <span class="context-label">Cascade Windows</span>
      </button>
      <button
        type="button"
        role="menuitem"
        data-taskbar-action="tile-horizontal"
      >
        <span class="context-check" aria-hidden="true"></span>
        <span class="context-label">Tile Windows Horizontally</span>
      </button>
      <button type="button" role="menuitem" data-taskbar-action="tile-vertical">
        <span class="context-check" aria-hidden="true"></span>
        <span class="context-label">Tile Windows Vertically</span>
      </button>
      <button type="button" role="menuitem" data-taskbar-action="show-desktop">
        <span class="context-check" aria-hidden="true"></span>
        <span class="context-label">Show the Desktop</span>
      </button>
      <span class="context-separator" aria-hidden="true"></span>
      <button type="button" role="menuitem" data-taskbar-action="task-manager">
        <span class="context-check" aria-hidden="true"></span>
        <span class="context-label">Task Manager</span>
      </button>
      <span class="context-separator" aria-hidden="true"></span>
      <button
        type="button"
        role="menuitemcheckbox"
        aria-checked="true"
        data-taskbar-action="lock"
      >
        <span class="context-check" aria-hidden="true">✓</span>
        <span class="context-label">Lock the Taskbar</span>
      </button>
      <button type="button" role="menuitem" data-taskbar-action="properties">
        <span class="context-check" aria-hidden="true"></span>
        <span class="context-label">Properties</span>
      </button>
    </div>
    <div
      id="taskbar-overflow-menu"
      class="xp-context-menu"
      role="menu"
      hidden
    ></div>

    <!-- Log Off Windows -->
    <div id="logoff-dialog" class="system-dialog-overlay" hidden>
      <div class="system-dialog" role="dialog" aria-labelledby="logoff-title">
        <div class="system-dialog-title">
          <span id="logoff-title">Log Off Windows</span>
          <span class="dialog-flag brand-flag" aria-hidden="true"></span>
        </div>
        <div class="system-dialog-actions">
          <button id="switch-user-confirm" type="button">
            <span
              class="dialog-action-icon switch-user-icon"
              aria-hidden="true"
            ></span>
            <span>Switch User</span>
          </button>
          <button id="logoff-confirm" type="button">
            <span
              class="dialog-action-icon xp-logoff-icon"
              aria-hidden="true"
            ></span>
            <span>Log Off</span>
          </button>
        </div>
        <div class="system-dialog-footer">
          <button id="logoff-cancel" type="button">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Turn off computer -->
    <div id="shutdown-dialog" class="system-dialog-overlay" hidden>
      <div class="system-dialog" role="dialog" aria-labelledby="shutdown-title">
        <div class="system-dialog-title">
          <span id="shutdown-title">Turn off computer</span>
          <span class="dialog-flag brand-flag" aria-hidden="true"></span>
        </div>
        <div class="system-dialog-actions shutdown-actions">
          <button id="standby-confirm" type="button">
            <span
              class="dialog-action-icon standby-icon xp-power-icon"
              aria-hidden="true"
            ></span>
            <span>Stand By</span>
          </button>
          <button id="shutdown-confirm" type="button">
            <span
              class="dialog-action-icon shutdown-icon xp-power-icon"
              aria-hidden="true"
            ></span>
            <span>Turn Off</span>
          </button>
          <button id="restart-confirm" type="button">
            <span
              class="dialog-action-icon restart-icon"
              aria-hidden="true"
            ></span>
            <span>Restart</span>
          </button>
        </div>
        <div class="system-dialog-footer">
          <button id="shutdown-cancel" type="button">Cancel</button>
        </div>
      </div>
    </div>

    <!-- Shutting down -->
    <div id="shutdown-screen" hidden>
      <img src="assets/xp/WindowsWordmark.png" alt="Microsoft Windows XP" />
      <p>Windows is shutting down...</p>
    </div>

    <!-- Safe to turn off -->
    <div id="turn-off-screen" hidden>
      <img src="assets/xp/WindowsWordmark.png" alt="Microsoft Windows" />
      <p>It is now safe to turn off your computer.</p>
      <span class="turn-off-hint">Click anywhere to restart</span>
    </div>

    <!-- Stand By blocks the shell without ending the current session. -->
    <div id="standby-screen" hidden>
      <div role="dialog" aria-modal="true" aria-labelledby="standby-title">
        <p id="standby-title">Windows is standing by.</p>
        <button id="standby-resume" type="button">Resume</button>
        <span
          >Move the pointer, click, or press a key to return to your
          session.</span
        >
      </div>
    </div>
  </body>
</html>
