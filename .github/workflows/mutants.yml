name: Mutants
# Mutation testing (scripts/mutants.ts with Stryker). It never blocks a merge: no
# other workflow needs it.
# - A pull request mutates the source lines it changed, and one comment lists the
#   changes no test noticed, for a follow-up. A pull request that changes this
#   setup also runs one real part, so a broken setup shows before Saturday.
# - Every week, a quarter of all source lines, split into 64 parts, so four weeks
#   cover everything. What lived is listed in the open "Missed mutants" issue.
on:
  pull_request:
    paths:
      - catalog/**
      - rtc/**
      - worker/**
      - tools/**
      - coverage-scope.json
      - stryker.conf.mjs
      - scripts/mutants.ts
      - scripts/mutants.test.ts
      - scripts/mutants-post.sh
      - scripts/mutants-post.test.sh
      - scripts/mutants-comment.sh
      - .github/workflows/mutants.yml
  schedule:
    - cron: "0 5 * * 6"
  workflow_dispatch:
    inputs:
      quarter:
        description: Which quarter of the parts to run, 0 to 3 (empty for this week's)
        required: false

permissions:
  contents: read

concurrency:
  # A newer push replaces a pull request's run; full runs never cancel.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || 'full' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changed:
    name: Mutants / Changed code
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its first parent, the base branch.
          fetch-depth: 2
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Restore Bun cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-install-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Mutate the changed code
        run: bun run scripts/mutants.ts diff HEAD^1 --out build/mutants
      - name: Try one part of everything
        run: |
          if git diff --quiet HEAD^1 -- stryker.conf.mjs coverage-scope.json scripts/mutants.ts scripts/mutants.test.ts scripts/mutants-comment.sh scripts/mutants-post.sh scripts/mutants-post.test.sh .github/workflows/mutants.yml; then
            echo "The setup didn't change."
          else
            bun run scripts/mutants.ts part 0 64 --out build/mutants-part
          fi
      - name: Comment what lived
        # A fork's token can't comment; its run page has the summary.
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: scripts/mutants-comment.sh build/mutants
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-changed
          path: |
            build/
            reports/mutation/
          retention-days: 14
          if-no-files-found: ignore

  plan:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      parts: ${{ steps.plan.outputs.parts }}
    steps:
      - name: Pick this week's parts
        id: plan
        env:
          QUARTER: ${{ inputs.quarter }}
        run: |
          quarter=${QUARTER:-$(( $(date -u +%s) / 604800 % 4 ))}
          [[ $quarter =~ ^[0-3]$ ]] || { echo "Quarter must be 0 to 3, got $quarter" >&2; exit 1; }
          echo "parts=$(jq -cn --argjson q "$quarter" '[range($q * 16; $q * 16 + 16)]')" >> "$GITHUB_OUTPUT"

  part:
    name: Part ${{ matrix.part }} of 64
    needs: plan
    runs-on: ubuntu-26.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.plan.outputs.parts) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Restore Bun cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-install-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json') }}
          restore-keys: |
            bun-install-${{ runner.os }}-
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Lived changes are findings for the issue; only a run that never got to its tally fails.
      - name: Mutation testing
        run: bun run scripts/mutants.ts part "${{ matrix.part }}" 64 --out build/mutants
      - name: Upload what lived
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-part-${{ matrix.part }}
          path: |
            build/mutants/
            reports/mutation/
          retention-days: 14
          if-no-files-found: ignore

  report:
    needs: [plan, part]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test report posting
        run: bash scripts/mutants-post.test.sh
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: mutants-part-*
          path: results
      - name: List what lived in the open issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PARTS: ${{ needs.plan.outputs.parts }}
          JOBS: ${{ needs.part.result }}
        run: |
          lived=$(cat results/*/build/mutants/lived.txt results/*/lived.txt 2>/dev/null | sort -u || true)
          parts=$(jq -r 'map(tostring) | join(", ")' <<< "$PARTS")
          # A part whose job died leaves no artifact, so its mutants are in no list below.
          lost=$(jq -r '.[]' <<< "$PARTS" | while read -r part; do
            [ -d "results/mutants-part-$part" ] || echo "$part"
          done | paste -sd, - | sed 's/,/, /g')
          {
            echo "Parts $parts of 64: [run]($RUN), jobs $JOBS."
            echo
            if [ -n "$lost" ]; then
              echo "**No results from part $lost, so its mutants are not listed.** Rerun the failed jobs of the run."
              echo
            fi
            if [ -z "$lived" ] && [ -z "$lost" ]; then
              echo 'Every change in these parts was caught by a test.'
            else
              for status in findings timeout; do
                if [ "$status" = timeout ]; then
                  rows=$(grep '  timeout:' <<< "$lived" || true)
                  heading='Timed out'
                  note='Stryker stopped these changes at its timeout.'
                else
                  rows=$(grep -v '  timeout:' <<< "$lived" || true)
                  heading='Lived'
                  note='No test noticed these changes. Real gaps get their own PR; changes that keep the same behavior can be ignored.'
                fi
                if [ -n "$rows" ]; then
                  echo "### $heading ($(wc -l <<< "$rows"))"
                  echo "$note"
                  echo '```'
                  echo "$rows"
                  echo '```'
                fi
              done
            fi
          } > report.md
          head -c 1000000 report.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n\nFull report: %s#artifacts\n' "$RUN" >> "$GITHUB_STEP_SUMMARY"
          has_findings=false
          [ -z "$lived" ] || has_findings=true
          [ -z "$lost" ] || has_findings=true
          scripts/mutants-post.sh report.md "$has_findings"
